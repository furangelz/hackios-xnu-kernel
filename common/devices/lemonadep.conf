# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="OnePlus 9 Pro (lemonadep)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 888 (SM8350)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=lemonadep
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
DTB=none                        # none: ABL uses the phone's own (vendor_boot), not the OnePlus 9's
BOOT_ARGS="--os_version 17.0.0 --os_patch_level 2035-06 --cmdline console=null"   # as the ios-sweet shim
# display test: -DFB_TEST_BASE=0xE4D00000 -DFB_TEST_STRIDE=4320 makes the boot shim paint a red band
# into ABL's framebuffer before anything else runs (see FbBandDxe in the UEFI port)
BOOTSHIM_DEFS=
FD_BASE=0x9FD00000              # where the boot shim puts the UEFI image (the UEFI port's memory map)
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000         # where the kernel + images container goes (free RAM in the memory map)
                                # checked 2026-10-22: DDR, in no reserved-memory node of the phone's tree

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by what the firmware reports (see docs/PORTING.md):
# a new SoC needs one there (common/new-device.sh writes a starting point next to this file).
FB_BASE=0xE4D00000              # framebuffer base the UEFI reports (GOP) -- identifies the device
                                # (ABL leaves the panel scanning out 1080x2412, stride 4320, here)
WIFI_ATH11K=0                   # 1: build the ath11k Wi-Fi driver into the kernel (WCN6750 radios)

# --- what the run needs ----------------------------------------------------------------------------
# Checked on the phone 2026-10-22: the kernel on the X1 (bootcpu=7) with cores 7..1 (cpus=8), the
# loader watching from core 0; cpufreq=1 (EPSS, the same block as redwood's: 1804/2419/2841 MHz);
# buttons=1 (board=lemonadep mapping: RESIN volume up, PM8350 GPIO6 volume down); touchscreen=1 with
# touch_power=1: the Synaptics S3908, its supply switched on through RPMh (ldoc3) and its two
# enable pins (bsd/dev/redwood_synaptics.c). No GPU, Wi-Fi or sound drivers for this phone yet.
BOOTARGS="cpus=8 bootcpu=7 cpufreq=1 buttons=1 touchscreen=1 touch_power=1"
DEFAULT_SECS=900
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
FIRMWARE=""
# Boot image header version for this ABL (SM8350 / lemonadep: 3, like Mu-Silicium's lemonade.toml)
BOOT_HEADER_VERSION=3
